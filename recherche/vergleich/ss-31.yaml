name: SS-31 (Elamipretid)
gruppe: D
evidenz: B
zulassung_eu: "nein"
zulassung_usa: "ja, beschleunigt (Forzinity, 2025, nur Barth-Syndrom ab 30 kg)"
wada: "nicht namentlich gelistet (Stand 2026)"
humanstudien: 19
registerstudien: 21
kernergebnis: "In der Phase-3-Studie MMPOWER-3 mit 218 Personen mit mitochondrialer Myopathie verbesserte Elamipretid weder Gehstrecke noch Erschöpfung (PMID 37268435); beim Barth-Syndrom zeigten sich nur in der offenen Verlängerung Verbesserungen (PMID 33077895)."
hauptrisiko: "Sehr häufig Reaktionen an der Einstichstelle; Langzeitdaten nur für wenige Personen; Graumarkt-„SS-31“ ist nicht das geprüfte Arzneimittel."
ausblick: "Phase-3-Studie ReNEW bei trockener Makuladegeneration (NCT06373731) soll 2027 enden; Bestätigungsstudie bei Barth-Syndrom läuft (NCT07531251)."
