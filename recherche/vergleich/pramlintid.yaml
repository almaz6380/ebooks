name: Pramlintid
gruppe: A
evidenz: A
zulassung_eu: "nein"
zulassung_usa: "ja (Symlin, seit 2005, Zusatz zu Mahlzeiteninsulin)"
wada: "nicht gelistet (Stand 2026)"
humanstudien: 76
registerstudien: 64
kernergebnis: "Bei insulinbehandeltem Typ-2-Diabetes senkte Pramlintid den HbA1c-Wert nach 52 Wochen um 0,62 Prozentpunkte bei 1,4 kg Gewichtsabnahme statt Zunahme (PMID 12610038)."
hauptrisiko: "Schwere Unterzuckerung in Kombination mit Insulin sowie häufige Übelkeit."
ausblick: "Kaum neue Arzneimittelstudien; Bedeutung vor allem als Vorläufer lang wirksamer Amylin-Analoga und in Zwei-Hormon-Pumpensystemen."
