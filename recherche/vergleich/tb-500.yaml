name: TB-500 / Thymosin Beta-4
gruppe: B
evidenz: B
zulassung_eu: "nein"
zulassung_usa: "nein"
wada: "verboten (S2, Thymosin-β4 und Derivate wie TB-500)"
humanstudien: 9
registerstudien: 18
kernergebnis: "Thymosin Beta-4 (nicht TB-500) verringerte in einer RCT mit 96 Herzinfarkt-Patienten die Infarktgröße insgesamt nicht signifikant, nur in einer Untergruppe (PMID 41229390); TB-500 selbst wurde nie am Menschen untersucht."
hauptrisiko: "Graumarkt-TB-500 mit unklarem Inhalt; theoretisch Förderung von Tumorwachstum durch Zellwanderung und Gefäßneubildung."
ausblick: "Phase-3-Studie SEER-2 mit Augentropfen bei neurotropher Keratopathie (NCT05555589) und Phase-2c-Studie nach Herzinfarkt (NCT07586865) laufen bzw. sind geplant."
