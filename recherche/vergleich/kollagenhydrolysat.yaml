name: Kollagenpeptide (Kollagenhydrolysat)
gruppe: F
evidenz: B
zulassung_eu: "nein (Lebensmittel/Nahrungsergänzung; kein zugelassener Health Claim)"
zulassung_usa: "nein (Nahrungsergänzungsmittel)"
wada: "nicht gelistet (Stand 2026)"
humanstudien: 101
registerstudien: 237
kernergebnis: "In einer Meta-Analyse von 35 RCTs mit 3.165 Arthrose-Patienten verringerten Kollagenderivate Schmerz und Funktionseinschränkung nur gering (SMD −0,35 bzw. −0,31; PMID 38218227); der Hautnutzen verschwand in nicht industriefinanzierten Studien (PMID 40324552)."
hauptrisiko: "Gut verträglich; Hauptrisiko ist der Ersatz wirksamer Maßnahmen, theoretisch mehr Oxalat im Urin bei Nierensteinneigung."
ausblick: "Eine Placebo-kontrollierte Studie mit 204 Teilnehmenden zur Kniearthrose läuft am Istituto Ortopedico Rizzoli (NCT04998188)."
