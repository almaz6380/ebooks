name: Oxytocin (Nasenspray)
gruppe: E
evidenz: B
zulassung_eu: "nur als Infusion/Injektion für die Geburtshilfe; kein Nasenspray für psychische Anwendungen"
zulassung_usa: "nur als Injektion für die Geburtshilfe (Pitocin)"
wada: "nicht gelistet (Stand 2026)"
humanstudien: 349
registerstudien: 263
kernergebnis: "In der SOARS-B-Studie mit 290 Kindern und Jugendlichen mit Autismus unterschied sich Oxytocin nach 24 Wochen nicht von Placebo (−3,7 vs. −3,5 Punkte sozialer Rückzug) (PMID 34644471)."
hauptrisiko: "In Studien gut verträglich; Risiken durch Wasserretention in hohen Dosen, Wehenauslösung in der Schwangerschaft und ungeprüfte Graumarkt-Sprays."
ausblick: "Laufende Studien prüfen Oxytocin als Ergänzung zu Psychotherapie und als Ersatz bei Oxytocin-Mangel (NCT06194851, NCT06036004)."
