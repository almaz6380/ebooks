kernergebnis: "In zwei RCTs verlängerte Afamelanotid die schmerzfreie Zeit im direkten Sonnenlicht bei EPP (EU-Studie Median 6,0 vs. 0,8 Stunden) und verbesserte die Lebensqualität (PMID 26132941)."
hauptrisiko: "Meist leichte Übelkeit, Kopfschmerzen und Müdigkeit; dunklere Muttermale erfordern regelmäßige Hautkontrollen."
