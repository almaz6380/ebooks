kernergebnis: "Bei Mäusen verhinderte MOTS-c ernährungsbedingtes Übergewicht und Insulinresistenz (PMID 25738459); beim Menschen gibt es nur Beobachtungsdaten zu körpereigenen Spiegeln, keine veröffentlichten Gabe-Studien."
hauptrisiko: "Keine Sicherheitsdaten zur Gabe am Menschen; ungeprüfte Graumarktprodukte; Dopingverstoß im Sport."
ausblick: "Die erste Phase-2-Studie mit MOTS-c bei Prädiabetes (NCT07505745, 120 Teilnehmende) läuft bis 2028."
