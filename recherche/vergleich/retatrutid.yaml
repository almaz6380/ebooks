kernergebnis: "In TRIUMPH-1 verringerte sich das Körpergewicht nach 80 Wochen unter der höchsten Dosis um 25,0 % gegenüber 3,9 % unter Placebo (PMID 42814954)."
hauptrisiko: "Dosisabhängige Magen-Darm-Beschwerden, Missempfindungen der Haut (Dysästhesie) und höhere Abbruchraten in hohen Dosen."
ausblick: "Die Endpunktstudie TRIUMPH-Outcomes (NCT06383390) und der direkte Vergleich mit Tirzepatid (NCT06662383) laufen; Zulassungsanträge werden erwartet."
