kernergebnis: "In einer RCT mit 342 Zöliakie-Patienten mit Beschwerden trotz glutenfreier Diät erreichte nur die niedrigste Dosis (0,5 mg) das Hauptziel, höhere Dosen wirkten nicht besser als Placebo (PMID 25683116)."
hauptrisiko: "Gut verträglich; Hauptgefahr ist eine gelockerte glutenfreie Diät im Vertrauen auf ein nicht belegtes Mittel."
ausblick: "Die Phase-3-Studie CeDLara (NCT03569007) wurde 2022 abgebrochen; derzeit keine laufende Studie, Long-COVID-Ergebnisse (NCT05747534) stehen aus."
