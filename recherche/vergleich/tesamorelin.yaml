name: Tesamorelin
gruppe: C
evidenz: A
zulassung_eu: "nein"
zulassung_usa: "ja (Egrifta, HIV-assoziierte Lipodystrophie)"
wada: "verboten (S2)"
humanstudien: 23
registerstudien: 23
kernergebnis: "In zwei Phase-3-Studien mit 806 Personen mit HIV senkte Tesamorelin das viszerale Bauchfett um 15,4 % gegenüber Placebo (PMID 20554713)."
hauptrisiko: "Gelenk-/Muskelschmerzen, Wassereinlagerungen, Injektionsreaktionen, vorübergehend höherer Blutzucker; Effekt verschwindet nach Absetzen."
ausblick: "Kleine Phase-2-Studien laufen (z. B. NCT06554717, körperliche Funktion bei HIV); EU-Zulassung nicht absehbar."
