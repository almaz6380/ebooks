name: Thymosin Alpha-1 (Thymalfasin)
gruppe: B
evidenz: B
zulassung_eu: "nein"
zulassung_usa: "nein (FDA 2023: Einschränkung für Rezepturherstellung); zugelassen u. a. in China (Zadaxin)"
wada: "nicht gelistet (Stand 2026)"
humanstudien: 90
registerstudien: 66
kernergebnis: "In der doppelblinden Phase-3-Studie TESTS mit 1.106 Sepsis-Patienten lag die 28-Tage-Sterblichkeit bei 23,4 % vs. 24,1 % unter Placebo – kein Unterschied (PMID 39814420)."
hauptrisiko: "In Studien gut verträglich; mögliche Nachteile in Untergruppen (jüngere Sepsis-Patienten, schwere COVID-19) und unbekannte Qualität von Graumarkt-Produkten."
ausblick: "Eine Phase-3-Studie mit 2.500 Personen zur Nachbehandlung von Darmkrebs (NCT05086614) soll 2027 enden."
