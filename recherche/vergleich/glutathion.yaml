name: Glutathion
gruppe: D
evidenz: B
zulassung_eu: "als Nahrungsergänzungsmittel im Handel; Injektionen nur vereinzelt national für spezielle Indikationen, nicht zur Hautaufhellung"
zulassung_usa: "nein (nur Nahrungsergänzungsmittel und Apotheken-Rezepturen)"
wada: "Substanz nicht verboten; Infusionen über 100 ml/12 h verboten (M2)"
humanstudien: 161
registerstudien: 273
kernergebnis: "In einer Phase-3-Studie mit 185 Krebspatientinnen und -patienten verhinderten Glutathion-Infusionen chemotherapiebedingte Nervenschäden nicht (PMID 24619793); oral erhöhte es nach 6 Monaten die Blutspiegel um 30–35 % (PMID 24791752)."
hauptrisiko: "Infusionen zur Hautaufhellung: Behördenwarnungen wegen schwerer Haut- und Infusionsreaktionen und verunreinigter Rezepturen (Endotoxin)."
ausblick: "Nur kleine Studien zu neuen Darreichungsformen und Zusatztherapien registriert (z. B. NCT06896422); ein klinischer Nutzen höherer Spiegel ist unbelegt."
