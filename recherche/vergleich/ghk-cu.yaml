name: GHK-Cu (Kupferpeptid)
gruppe: F
evidenz: C
zulassung_eu: "nein (kosmetischer Inhaltsstoff; Injektion nicht zugelassen)"
zulassung_usa: "nein (kosmetischer Inhaltsstoff; Einschränkungen für injizierbare Apothekenzubereitungen, bitte prüfen)"
wada: "nicht namentlich gelistet; Injektion ggf. S0 (Stand 2026)"
humanstudien: 1
registerstudien: 24
kernergebnis: "In einer randomisierten Studie an diabetischen Fußgeschwüren verkleinerte GHK-Cu-Gel die Wundfläche median um 98,5 % gegenüber 60,8 % mit Trägergel (PMID 17147644); kosmetische Studien sind kaum veröffentlicht."
hauptrisiko: "Als Creme gut verträglich; Injektionen von Graumarktware ohne Sicherheitsdaten (Kupferbelastung, Verunreinigung, Infektion)."
ausblick: "Keine glaubwürdige laufende Studie zu medizinischen Endpunkten; registriert ist nur eine Herstellerstudie zu GHK-Spiegeln unter einem Pflaster (NCT07706361)."
