name: Maridebart Cafraglutid (MariTide)
gruppe: A
evidenz: B
zulassung_eu: "nein"
zulassung_usa: "nein"
wada: "verboten als nicht zugelassene Substanz (S0)"
humanstudien: 2
registerstudien: 28
kernergebnis: "In der Phase-2-Studie sank das Körpergewicht bei Adipositas ohne Diabetes nach 52 Wochen um 12,3 bis 16,2 % gegenüber 2,5 % unter Placebo (PMID 40549887)."
hauptrisiko: "Häufige Magen-Darm-Beschwerden; sehr lange Wirkdauer erschwert das Absetzen, Langzeitfolgen der GIP-Blockade unbekannt."
ausblick: "Das Phase-3-Programm MARITIME (z. B. NCT06858839) sowie Endpunktstudien zu Herz-Kreislauf-Ereignissen (NCT07037433) und Herzinsuffizienz (NCT07037459) laufen."
