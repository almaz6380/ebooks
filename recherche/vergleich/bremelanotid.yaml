name: Bremelanotid (PT-141)
gruppe: E
evidenz: A
zulassung_eu: "nein"
zulassung_usa: "ja (Vyleesi, seit 2019, Frauen vor den Wechseljahren mit HSDD)"
wada: "nicht namentlich gelistet (Stand 2026)"
