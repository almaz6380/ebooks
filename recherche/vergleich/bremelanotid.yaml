kernergebnis: "In den Phase-3-Studien RECONNECT (1.267 Frauen) stieg das sexuelle Verlangen um 0,35 Punkte und sank der Leidensdruck um 0,33 Punkte stärker als unter Placebo (PMID 31599840)."
hauptrisiko: "Übelkeit bei rund 40 % mit häufigen Therapieabbrüchen, Hitzegefühl und kurzzeitige Blutdruckanstiege."
ausblick: "Eine Phase-2-Studie prüft Bremelanotid zusätzlich zu Tirzepatid bei Adipositas (NCT06565611); eine EU-Zulassung ist nicht beantragt."
