kernergebnis: "Bei 110 Kindern mit GH-Mangel stieg die Wachstumsgeschwindigkeit unter Sermorelin von 4,1 auf 7,2 cm/Jahr nach 12 Monaten (PMID 8772599); Studien an Älteren umfassen nur 11–19 Personen."
