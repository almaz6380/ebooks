kernergebnis: "In der größten Studie CASTA mit 1.070 Personen nach akutem Schlaganfall verfehlte Cerebrolysin den Hauptendpunkt nach 90 Tagen (PMID 22282884); die Cochrane-Übersicht fand keinen Einfluss auf die Sterblichkeit (PMID 37818733)."
hauptrisiko: "Mögliches Signal für mehr nicht tödliche schwere Nebenwirkungen beim Schlaganfall (Cochrane) und seltene schwere allergische Reaktionen bei intravenöser Gabe."
ausblick: "Nur kleine registrierte Studien (z. B. CADASIL, NCT05755997); eine große unabhängige Studie mit Behinderung nach 90 Tagen als Hauptendpunkt fehlt."
